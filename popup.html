<!DOCTYPE html>
<html>

<head>
    <title>ChatGPT Prompt Automation</title>
    <style>
        body {
            width: 300px;
            padding: 10px;
        }

        .prompt-item {
            margin-bottom: 10px;
            padding: 5px;
            border: 1px solid #ccc;
        }

        textarea {
            width: 100%;
            height: 60px;
        }

        .separator-input {
            margin: 10px 0;
        }
        .prompt-preview {
            white-space: pre-wrap;
            background: #f5f5f5;
            padding: 8px;
            border-radius: 4px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .edit-mode textarea {
            width: 100%;
            min-height: 100px;
            margin: 8px 0;
        }
        
        .button-group {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }

        #progress-section {
            display: none;
            margin: 10px 0 6px;
            padding: 8px 10px;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 6px;
        }
        #progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #495057;
            margin-bottom: 6px;
        }
        #progress-track {
            background: #dee2e6;
            border-radius: 4px;
            height: 8px;
            overflow: hidden;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            border-radius: 4px;
            background: #0d6efd;
            transition: width 0.4s ease, background 0.3s ease;
        }

        #stop-chain {
            width: 100%;
            margin-top: 8px;
            padding: 7px;
            background: #dc3545;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
        }
        #stop-chain:hover { background: #b02a37; }
    </style>
</head>

<body>
    <h2>Saved Prompt Chains</h2>
    <div id="prompts-list"></div>
    <h3>Add New Prompt Chain</h3>
    <div class="separator-input">
        <label>Chain Separator: </label>
        <input type="text" id="separator" value="~" placeholder="Separator between prompts">
    </div>
    <textarea id="new-prompt" placeholder="Enter your prompts, separated by the chain separator"></textarea>
    <button id="save-prompt">Save Prompt Chain</button>

    <div id="progress-section">
        <div id="progress-header">
            <span id="progress-text">0 / 0 prompts</span>
            <span id="progress-status">Starting…</span>
        </div>
        <div id="progress-track">
            <div id="progress-bar"></div>
        </div>
    </div>
    <button id="stop-chain">&#9632; Stop Chain</button>
    <script src="popup.js"></script>
</body>

</html>
